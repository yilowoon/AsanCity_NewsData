name: daily-collect

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 08:00 (KST)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집 → 조회수 → 통합 → 대시보드
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEWSTORE_API_KEY: ${{ secrets.NEWSTORE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.1-flash-lite
          TZ: Asia/Seoul
        run: python run.py daily
      - name: 결과 커밋 (Render 자동 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asan_news.db dashboard/data.js
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date +%F)"
          git push
