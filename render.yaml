# Render Blueprint — Node 웹서비스 (대시보드 + 관리자 페이지 + 갱신 API)
# 비밀값(sync: false)은 Render 화면에서 직접 입력한다.
services:
  - type: web
    runtime: node
    name: asancity-newsdata
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: yilowoon/AsanCity_NewsData
